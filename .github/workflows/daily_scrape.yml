name: Daily Remote Jobs Scrape

on:
  schedule:
    # Run every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape & Update Excel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py

      - name: Commit and push updated Excel
        run: |
          git config user.name  "career-scan-bot"
          git config user.email "career-scan-bot@users.noreply.github.com"

          git add remote_jobs.xlsx

          if git diff --cached --quiet; then
            echo "No new jobs - nothing to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore: update remote jobs - $DATE [skip ci]"
            git push origin HEAD
            echo "Pushed updated remote_jobs.xlsx for $DATE"
          fi
